<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラーメンクイズ 200問版</title>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
     crossorigin="anonymous"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
padding:20px;
background:#0f172a;
font-family:Arial,sans-serif;
color:white;
text-align:center;
}
.container{
max-width:850px;
margin:auto;
background:#1e293b;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}
h1{
color:#facc15;
margin-top:0;
}
.question{
font-size:24px;
margin:25px 0;
line-height:1.6;
font-weight:bold;
}
.choice-btn{
display:block;
width:100%;
margin:10px 0;
padding:14px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:17px;
cursor:pointer;
transition:.2s;
}
.choice-btn:hover{
background:#1d4ed8;
transform:translateY(-1px);
}
.correct{
background:#16a34a !important;
}
.wrong{
background:#dc2626 !important;
}
.hidden{
display:none;
}
.start-btn{
padding:14px 28px;
border:none;
border-radius:12px;
background:#facc15;
color:#111827;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
.progress{
margin-bottom:15px;
color:#d1d5db;
}
.status{
margin-top:15px;
font-size:20px;
font-weight:bold;
min-height:30px;
}
.ad-area{
margin:20px 0;
background:#334155;
padding:10px;
border-radius:12px;
min-height:100px;
}
@media(max-width:600px){
.question{
font-size:20px;
}
.choice-btn{
font-size:16px;
}
}
</style>
</head>
<body>

<div class="container">

<h1>ラーメンクイズ 200問版</h1>

<div class="ad-area">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398161859137802"
     crossorigin="anonymous"></script>
<!-- チェス -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-8398161859137802"
     data-ad-slot="5599163841"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</div>

<div id="startScreen">
<p>全200問から50問をランダム出題！<br>同じ問題は出ません。</p>
<button class="start-btn" onclick="startQuiz()">スタート</button>
</div>

<div id="quizScreen" class="hidden">
<div class="progress" id="progress"></div>
<div class="question" id="question"></div>
<div id="choices"></div>
<div class="status" id="status"></div>
</div>

<div id="resultScreen" class="hidden">
<h2>結果発表</h2>
<p id="resultText"></p>
<button class="start-btn" onclick="startQuiz()">もう一度遊ぶ</button>
</div>

</div>

<script>
const baseQuestions = [
["札幌ラーメンの特徴として有名なのは？","味噌"],
["博多ラーメンの特徴として有名なのは？","豚骨"],
["喜多方ラーメンの特徴として有名なのは？","太い縮れ麺"],
["和歌山ラーメンで有名なのは？","豚骨醤油"],
["尾道ラーメンの特徴は？","背脂"],
["東京ラーメンの定番スープは？","醤油"],
["塩ラーメンの特徴は？","透明感のあるスープ"],
["つけ麺で有名な食べ方は？","麺をスープにつける"],
["油そばの特徴は？","スープが少ない"],
["二郎系ラーメンの特徴は？","大量の野菜"]
];

const allQuestions = [];

for(let i=0;i<20;i++){
 baseQuestions.forEach((q)=>{
   allQuestions.push({
     q:`第${i+1}問: ${q[0]}`,
     a:q[1],
     c:shuffle([
       q[1],
       "味噌",
       "塩",
       "醤油",
       "豚骨",
       "魚介",
       "激辛",
       "鶏白湯"
     ]).slice(0,4)
   });
 });
}

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

let questions=[];
let current=0;
let score=0;
let answered=false;

function startQuiz(){

const unique = [...new Map(allQuestions.map(item => [item.q,item])).values()];

questions = shuffle([...unique]).slice(0,50);

current=0;
score=0;

document.getElementById("startScreen").classList.add("hidden");
document.getElementById("resultScreen").classList.add("hidden");
document.getElementById("quizScreen").classList.remove("hidden");

showQuestion();
}

function showQuestion(){

answered=false;

const q = questions[current];

document.getElementById("progress").textContent =
`問題 ${current+1} / ${questions.length}　正解数：${score}`;

document.getElementById("question").textContent = q.q;

document.getElementById("status").textContent = "";

const choices = document.getElementById("choices");
choices.innerHTML = "";

shuffle([...q.c]).forEach(choice => {

const btn = document.createElement("button");

btn.className = "choice-btn";

btn.textContent = choice;

btn.onclick = () => answer(btn, choice, q.a);

choices.appendChild(btn);

});
}

function answer(button, selected, correct){

if(answered) return;

answered=true;

const buttons=document.querySelectorAll(".choice-btn");

buttons.forEach(btn=>{
btn.disabled=true;

if(btn.textContent===correct){
btn.classList.add("correct");
}
});

if(selected===correct){

score++;

button.classList.add("correct");

document.getElementById("status").textContent="正解！";

}else{

button.classList.add("wrong");

document.getElementById("status").textContent=
`不正解！ 正解は「${correct}」`;

}

setTimeout(()=>{

current++;

if(current<questions.length){

showQuestion();

}else{

showResult();

}

},1000);

}

function showResult(){

document.getElementById("quizScreen").classList.add("hidden");

document.getElementById("resultScreen").classList.remove("hidden");

document.getElementById("resultText").textContent =
`50問中 ${score}問正解！`;

}
</script>

</body>
</html>
