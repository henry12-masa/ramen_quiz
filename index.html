<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラーメンクイズ 200問版</title>
<style>
body{
font-family:sans-serif;
background:#111827;
color:#fff;
text-align:center;
padding:20px;
}
.container{
max-width:800px;
margin:auto;
background:#1f2937;
padding:20px;
border-radius:16px;
}
button{
display:block;
width:100%;
margin:10px 0;
padding:14px;
font-size:16px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}
.correct{background:#16a34a!important;}
.wrong{background:#dc2626!important;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="container">
<h1>ラーメンクイズ 200問版</h1>

<div id="start">
<p>50問ランダム出題・重複なし</p>
<button onclick="startQuiz()">スタート</button>
</div>

<div id="quiz" class="hidden">
<h2 id="progress"></h2>
<h3 id="question"></h3>
<div id="choices"></div>
<p id="result"></p>
</div>

<div id="end" class="hidden">
<h2 id="score"></h2>
<button onclick="startQuiz()">もう一度遊ぶ</button>
</div>

</div>

<script>
const baseQuestions = [
["札幌ラーメンの特徴として有名なのは？","味噌"],
["博多ラーメンの特徴として有名なのは？","豚骨"],
["喜多方ラーメンの特徴として有名なのは？","太い縮れ麺"],
["和歌山ラーメンで有名なのは？","豚骨醤油"],
["尾道ラーメンの特徴は？","背脂"],
["東京ラーメンの定番スープは？","醤油"],
["塩ラーメンの特徴は？","透明感のあるスープ"],
["つけ麺で有名な食べ方は？","麺をスープにつける"],
["油そばの特徴は？","スープが少ない"],
["二郎系ラーメンの特徴は？","大量の野菜"]
];

const allQuestions = [];

for(let i=0;i<20;i++){
 baseQuestions.forEach((q,index)=>{
   allQuestions.push({
      q:`第${i+1}問: ${q[0]}`,
      a:q[1],
      c:shuffle([q[1],"味噌","塩","豚骨","醤油","魚介"]).slice(0,4)
   });
 });
}

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-0.5);
}

let questions=[];
let current=0;
let score=0;
let lock=false;

function startQuiz(){
 questions = shuffle(allQuestions).slice(0,50);
 current=0;
 score=0;
 document.getElementById("start").classList.add("hidden");
 document.getElementById("end").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 showQuestion();
}

function showQuestion(){
 lock=false;
 const q=questions[current];
 document.getElementById("progress").textContent=`${current+1} / 50`;
 document.getElementById("question").textContent=q.q;
 document.getElementById("result").textContent="";
 const choices=document.getElementById("choices");
 choices.innerHTML="";
 q.c.forEach(choice=>{
   const btn=document.createElement("button");
   btn.textContent=choice;
   btn.onclick=()=>answer(btn,choice,q.a);
   choices.appendChild(btn);
 });
}

function answer(btn,choice,correct){
 if(lock)return;
 lock=true;

 document.querySelectorAll("#choices button").forEach(b=>{
   b.disabled=true;
   if(b.textContent===correct)b.classList.add("correct");
 });

 if(choice===correct){
   score++;
   btn.classList.add("correct");
   document.getElementById("result").textContent="正解！";
 }else{
   btn.classList.add("wrong");
   document.getElementById("result").textContent=`不正解！ 正解: ${correct}`;
 }

 setTimeout(()=>{
   current++;
   if(current>=50){
      finish();
   }else{
      showQuestion();
   }
 },1000);
}

function finish(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("end").classList.remove("hidden");
 document.getElementById("score").textContent=`50問中 ${score}問正解！`;
}
</script>
</body>
</html>
